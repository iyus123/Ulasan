<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beri Kami Ulasan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
        .card { background: #ffffff; padding: 36px 24px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); max-width: 360px; width: 100%; text-align: center; position: relative; }
        
        h1 { font-size: 1.35rem; color: #111827; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.02em; }
        p.sub { font-size: 0.875rem; color: #6b7280; margin-bottom: 24px; }
        
        /* Star Rating */
        .stars { display: flex; justify-content: center; gap: 10px; font-size: 2.6rem; margin-bottom: 16px; user-select: none; }
        .star { cursor: pointer; color: #e5e7eb; transition: color 0.15s ease, transform 0.15s ease; }
        .star.active { color: #f59e0b; transform: scale(1.12); }
        .rating-text { font-size: 0.95rem; font-weight: 600; color: #374151; min-height: 24px; }
        
        /* Indikator Loading Smooth (Pill Badge + Spinner) */
        .loading-redirect {
            display: none;
            margin: 20px auto 0;
            padding: 8px 16px;
            background-color: #f3f4f6;
            border-radius: 50px;
            font-size: 0.825rem;
            color: #4b5563;
            font-weight: 500;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: fit-content;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .loading-redirect.show {
            display: inline-flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* Spinner CSS Murni */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #d1d5db;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Screen Error */
        .error-screen { display: none; padding: 12px; }
        .error-screen.show { display: block; }
        .error-title { font-size: 1.15rem; color: #dc2626; font-weight: 700; margin-bottom: 6px; }
        .error-desc { font-size: 0.875rem; color: #6b7280; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Tampilan Error (Jika ID QR Tidak Valid) -->
        <div id="error-screen" class="error-screen">
            <div class="error-title">⚠️ QR Code Tidak Valid</div>
            <div id="error-message" class="error-desc">Sistem ini belum dihubungkan ke toko.</div>
        </div>

        <!-- Tampilan Utama -->
        <div id="main-content">
            <h1>Bagaimana Pengalaman Anda?</h1>
            <p class="sub">Ketuk bintang untuk memberikan penilaian</p>
            
            <div class="stars">
                <span class="star" onclick="rate(1)">★</span>
                <span class="star" onclick="rate(2)">★</span>
                <span class="star" onclick="rate(3)">★</span>
                <span class="star" onclick="rate(4)">★</span>
                <span class="star" onclick="rate(5)">★</span>
            </div>

            <div id="rating-text" class="rating-text"></div>
            
            <!-- Indikator Loading Smooth -->
            <div id="redirect-loading" class="loading-redirect">
                <div class="spinner"></div>
                <span>Memproses masukan Anda...</span>
            </div>
        </div>
    </div>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DI SINI
        const apiURL = "MASUKKAN_URL_APPS_SCRIPT_ANDA_DI_SINI"; 

        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');

        let storeData = null;
        let isError = false;

        // Ambil data toko di latar belakang (Background Fetch)
        if (!qrId) {
            showError("QR Code tidak valid (ID tidak ditemukan di link).");
        } else {
            fetch(`${apiURL}?id=${qrId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.found) {
                        storeData = data;
                    } else {
                        showError(data.message);
                    }
                })
                .catch(() => {
                    showError("Gagal terhubung ke database server.");
                });
        }

        const texts = ["", "Sangat Buruk 😞", "Buruk 🙁", "Cukup 😐", "Bagus! 🙂", "Sangat Bagus! 🤩"];
        const stars = document.querySelectorAll('.star');

        stars.forEach((star, index) => {
            star.addEventListener('mouseover', () => highlightStars(index + 1));
            star.addEventListener('mouseout', () => resetStars());
        });

        function highlightStars(count) {
            if (isError) return;
            stars.forEach((s, i) => {
                if (i < count) s.classList.add('active');
                else s.classList.remove('active');
            });
            document.getElementById('rating-text').innerText = texts[count];
        }

        function resetStars() {
            if (isError) return;
            stars.forEach(s => s.classList.remove('active'));
            document.getElementById('rating-text').innerText = "";
        }

        function rate(rating) {
            if (isError) return;
            
            highlightStars(rating);
            
            // Tampilkan loading badge dengan animasi smooth
            const loadingBadge = document.getElementById('redirect-loading');
            loadingBadge.classList.add('show');

            const checkDataAndRedirect = () => {
                if (!storeData && !isError) {
                    setTimeout(checkDataAndRedirect, 150);
                    return;
                }

                if (isError) return;

                let wa = storeData.wa ? storeData.wa.toString() : "";
                if (wa.startsWith("0")) wa = "62" + wa.substring(1);
                
                const waMessage = encodeURIComponent("Halo Admin, saya ingin memberikan masukan mengenai layanan Anda.");

                if (rating <= 3) {
                    window.location.href = `https://wa.me/${wa}?text=${waMessage}`;
                } else {
                    window.location.href = `https://search.google.com/local/writereview?placeid=${storeData.placeid}`;
                }
            };

            checkDataAndRedirect();
        }

        function showError(msg) {
            isError = true;
            document.getElementById('main-content').classList.add('hidden');
            const errScreen = document.getElementById('error-screen');
            document.getElementById('error-message').innerText = msg;
            errScreen.classList.add('show');
        }
    </script>
</body>
</html>
